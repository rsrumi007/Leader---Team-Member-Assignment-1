<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Member Table</title>
  <style>
    * { box-sizing: border-box; }

    /* Animated gradient background */
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
    }

    /* Two blurred circles drifting in the background */
    body::before, body::after {
      content: "";
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.6;
      animation: drift 10s ease-in-out infinite;
    }
    body::before { width: 280px; height: 280px; top: 8%; left: 6%; background: #fde047; }
    body::after { width: 340px; height: 340px; bottom: 8%; right: 6%; background: #38bdf8; animation-delay: -5s; }

    /* Card fades in, then floats gently */
    .card {
      width: 100%;
      max-width: 780px;
      padding: 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      animation: fadeUp 0.9s ease backwards, float 5s ease-in-out 1s infinite;
    }

    /* Freeze the floating while the mouse is over the card, so hovering a row feels steady */
    .card:hover { animation-play-state: paused; }

    /* Title with moving gradient text */
    .title {
      display: table;
      margin: 0 auto 8px;
      font-size: 26px;
      color: transparent;
      background: linear-gradient(90deg, #4f46e5, #db2777, #7c3aed, #4f46e5);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }

    /* Every cell is a small rounded tile */
    table { width: 100%; border-collapse: separate; border-spacing: 6px 10px; text-align: center; }

    /* Header tiles with a moving colour wave */
    th {
      padding: 14px 8px;
      color: #fff;
      letter-spacing: 0.5px;
      border-radius: 14px;
      background: linear-gradient(90deg, #4f46e5, #db2777, #4f46e5, #db2777, #4f46e5);
      background-size: 200% 100%;
      animation: shimmer 5s linear infinite;
    }
    td { padding: 12px 8px; border-radius: 14px; color: #1f2937; transition: box-shadow 0.3s, filter 0.3s; }

    /* Column colours: SL = indigo, Name = pink, Roll = teal, Member = lavender, Section = gold */
    td:nth-child(1) { background: linear-gradient(135deg, #e0e7ff, #ddd6fe); }
    td:nth-child(2) { background: linear-gradient(135deg, #fce7f3, #f5d0fe); color: #581c87; font-size: 17px; font-weight: 700; }
    td:nth-child(3) { background: linear-gradient(135deg, #ccfbf1, #cffafe); }
    td:nth-child(4) { background: linear-gradient(135deg, #ede9fe, #e9d5ff); }
    td:nth-child(5) { background: linear-gradient(135deg, #fef9c3, #fde68a); }

    /* Coloured chips inside the cells */
    .num {
      display: inline-grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: #fff;
      font-weight: 700;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.45);
    }
    .chip { display: inline-block; padding: 6px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; letter-spacing: 0.8px; }
    .roll { color: #fff; background: linear-gradient(135deg, #0f766e, #0369a1); box-shadow: 0 4px 10px rgba(15, 118, 110, 0.4); }
    .section { color: #713f12; background: linear-gradient(135deg, #fde047, #fbbf24); box-shadow: 0 4px 10px rgba(234, 179, 8, 0.5); }

    /* Rows slide in one by one; hovering grows a row and lifts its tiles */
    tr { animation: slideIn 0.6s ease backwards; transition: transform 0.3s; }
    thead tr { animation-delay: 0.1s; }
    tbody tr:nth-child(1) { animation-delay: 0.3s; }
    tbody tr:nth-child(2) { animation-delay: 0.5s; }
    tbody tr:nth-child(3) { animation-delay: 0.7s; }
    tbody tr:nth-child(4) { animation-delay: 0.9s; }
    tbody tr:hover { transform: scale(1.03); }
    tbody tr:hover td { box-shadow: 0 10px 22px rgba(88, 28, 135, 0.22); filter: saturate(1.25); }

    /* Leader (pulsing) and Member badges */
    .badge { display: inline-block; padding: 5px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .leader { color: #fff; background: linear-gradient(45deg, #ea580c, #dc2626); animation: pulse 1.8s infinite; }
    .member { color: #1e1b4b; background: #a5b4fc; }

    /* Keyframes */
    @keyframes gradientMove { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes drift { 50% { transform: translate(50px, 40px) scale(1.2); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(40px); } }
    @keyframes float { 50% { transform: translateY(-8px); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-40px); } }
    @keyframes shimmer { to { background-position: 200% 0; } }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6); }
      70% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }

    /* Small screens */
    @media (max-width: 600px) {
      body { padding: 12px; }
      .card { padding: 12px; }
      .title { font-size: 20px; }
      table { border-spacing: 3px 8px; }
      th { padding: 10px 2px; font-size: 12px; letter-spacing: 0; }
      td { padding: 8px 2px; }
      td:nth-child(2) { font-size: 13px; }
      .num { width: 26px; height: 26px; font-size: 12px; }
      .chip { padding: 4px 8px; font-size: 12px; letter-spacing: 0.3px; }
      .badge { padding: 4px 9px; font-size: 11px; }
    }

    /* Very small phones */
    @media (max-width: 380px) {
      body { padding: 8px; }
      .card { padding: 8px; }
      table { border-spacing: 2px 6px; }
      th { font-size: 11px; }
      td:nth-child(2) { font-size: 12px; }
      .num { width: 22px; height: 22px; font-size: 11px; }
      .chip { padding: 3px 5px; font-size: 11px; }
      .badge { padding: 3px 6px; font-size: 10px; }
    }

    /* Respect the "reduce motion" setting */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 class="title">Team Member List</h2>
    <table>
      <thead>
        <tr><th>SL No</th><th>Name</th><th>Roll</th><th>Member</th><th>Section</th></tr>
      </thead>
      <tbody>
        <tr>
          <td><span class="num">1</span></td>
          <td>Saifullah</td>
          <td><span class="chip roll">265260</span></td>
          <td><span class="badge leader">Leader</span></td>
          <td><span class="chip section">A1</span></td>
        </tr>
        <tr>
          <td><span class="num">2</span></td>
          <td>Reza</td>
          <td><span class="chip roll">265283</span></td>
          <td><span class="badge member">Member</span></td>
          <td><span class="chip section">A1</span></td>
        </tr>
        <tr>
          <td><span class="num">3</span></td>
          <td>Minhaz</td>
          <td><span class="chip roll">265301</span></td>
          <td><span class="badge member">Member</span></td>
          <td><span class="chip section">A1</span></td>
        </tr>
        <tr>
          <td><span class="num">4</span></td>
          <td>Durjoy Dhar</td>
          <td><span class="chip roll">265295</span></td>
          <td><span class="badge member">Member</span></td>
          <td><span class="chip section">A1</span></td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
